services:
  postgres:
    image: postgres:15-alpine
    container_name: airindex_postgres
    environment:
      POSTGRES_USER: airindex_user
      POSTGRES_PASSWORD: airindex_secure_password_2026
      POSTGRES_DB: airindex_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airindex_user -d airindex_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: airindex_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://airindex_user:airindex_secure_password_2026@postgres:5432/airindex_db
      JWT_SECRET_KEY: airindex_super_secret_production_key_change_in_prod_2026_x98!
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: airindex_frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
